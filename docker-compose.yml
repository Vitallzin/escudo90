services:
  database:
    image: postgres:16-alpine
    container_name: loja-camisas-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: loja_camisas
    ports:
      - "5432:5432"
    volumes:
      - loja_camisas_data:/var/lib/postgresql/data

volumes:
  loja_camisas_data:
